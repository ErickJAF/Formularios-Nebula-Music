<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->
            <form class="auth-form" method="post" action="/crear-cuenta">
                <h1>Crear Cuenta</h1>
                <div>
                    <label for="nombre">Nombre Completo: </label>
                    <input type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Erick Armenta"
                    required
                    minlength="3"
                    maxlength="100">
                </div>

                <div>
                    <label for="contrasenia">Contraseña: </label>
                    <input type="password"
                           id="contrasenia"
                           name="contrasenia"
                           placeholder="****"
                           required
                           minlength="3"
                           maxlength="8">
                </div>

                <div>
                    <label for="correo">Correo Electronico: </label>
                    <input type="email"
                           id="correo"
                           name="correo"
                           placeholder="correo@gmail.com"
                           required
                           minlength="5"
                           maxlength="100">
                </div>

                <div>
                    <label for="pseudonimo">Pseudonimo: </label>
                    <input type="text"
                           id="pseudonimo"
                           name="pseudonimo"
                           placeholder="Menchaca-777"
                           required
                           pattern="[a-zA-Z]{3,10}-[0-9]{2,10}"
                </div>

                <div>
                    <label>Genero: </label>
                    <div>
                        <input type="radio" id="rag_femenino" name="genero" value="femenino" required>
                        <label for="rag_femenino">Femenino: </label>
                        <input type="radio" id="rag_masculino" name="genero" value="masculino">
                        <label for="rag_masculino">Masculino: </label>
                        <input type="radio" id="rag_menchaca" name="genero" value="menchaca">
                        <label for="rag_menchaca">Menchacoso: </label>
                    </div>
                </div>

                <div>
                    <label for="suscripcion">Tipo de Suscripcion: </label>
                    <select id="suscripcion" name="suscripcion" required>
                        <option value="">-- Selecciona una opcion --</option>
                        <option value="gratis">Gratis (Con anuncios)</option>
                        <option value="premium_mensual">Premium Mensual $199/mes</option>
                        <option value="premium_anual">Premium anual $999/año</option>
                    </select>
                </div>

                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento: </label>
                    <input type="date"
                           id="fechaNacimiento"
                           name="fechaNacimiento"
                           required>
                </div>

                <div>
                    <input type="checkbox" id="terminos" name="terminos" value="aceptado" required>
                    <label for="terminos">Acepto los terminos y condiciones de uso</label>
                </div>

                <div>
                    <label for="comentarios">Comentarios y preferencias</label>
                    <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="Cuentanos de tu musica favorita"></textarea>
                </div>
                <div>
                    <button type="submit">Registrarse</button>
                    <button type="reset">Limpiar Formulario</button>
                </div>
            </form>
            <p>
                ¿Ya tienes una cuenta? <a href="iniciar-sesion.html">Iniciar sesion aqui</a>
            </p>

        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
